.route{display:flex;align-items:center;gap:14px;font:800 clamp(1.8rem,6vw,2.7rem) var(--display)}

.stub .big{font:800 2.6rem var(--display);color:var(--sun);line-height:1.1}
.stub small{color:var(--muted);font-size:.82rem}
.nums{display:flex;flex-wrap:wrap;gap:6px 28px;font-weight:600}
.nums em{font:800 1.4rem var(--display);font-style:normal;margin-right:5px}
section{padding:54px 0;border-top:1px solid var(--line)}
.steps{list-style:none;padding:0;margin:0;display:grid;gap:18px;grid-template-columns:repeat(3,1fr)}
.steps li{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}

.col .nm{padding:8px 0;color:var(--muted);line-height:1.2}
.empty{border:2px dashed var(--line);border-radius:14px;padding:24px;color:var(--muted)}
