        function toggleLang() {
            currentLang = currentLang === 'ru' ? 'en' : 'ru';
            document.getElementById('langLabel').innerText = currentLang === 'ru' ? 'EN / RU' : 'RU / EN';
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[currentLang][key]) {
                    el.innerText = translations[currentLang][key];
                }
            });
            renderParticipants();
        }

        function openPaymentModal() {
            document.getElementById('paymentModal').classList.remove('hidden');
            document.getElementById('paymentModal').classList.add('flex');
        }

        function closeModals() {
            document.getElementById('paymentModal').classList.remove('flex');
            document.getElementById('paymentModal').classList.add('hidden');
            document.getElementById('dataModal').classList.remove('flex');
            document.getElementById('dataModal').classList.add('hidden');
        }

        function proceedToDataForm() {
            const amountInput = document.getElementById('customAmount').value;
            currentDonationAmount = parseInt(amountInput) || 1;
            
            // Закрываем первое окно
            document.getElementById('paymentModal').classList.remove('flex');
            document.getElementById('paymentModal').classList.add('hidden');
            
            // ИСПРАВЛЕНИЕ: убираем hidden и добавляем flex для второго окна
            document.getElementById('dataModal').classList.remove('hidden');
            document.getElementById('dataModal').classList.add('flex');
        }

        function renderParticipants() {
            const sorted = [...participants].sort((a, b) => b.amount - a.amount);
            
            const total = participants.reduce((sum, p) => sum + p.amount, 0);
            document.getElementById('totalAmount').innerText = total.toLocaleString();
            
            const percent = ((total / 1000000) * 100).toFixed(4);
            const bar = document.getElementById('progressBar');
            bar.style.width = Math.max(percent, 0.01) + '%';
            
            const progText = currentLang === 'ru' ? `Прогресс: ${percent}%` : `Progress: ${percent}%`;
            document.getElementById('progressText').innerText = progText;
            
            const badgeText = currentLang === 'ru' ? `Участников: ${participants.length}` : `Participants: ${participants.length}`;
            document.getElementById('participantsBadge').innerText = badgeText;

            // Топ-10
            const top10 = sorted.slice(0, 10);
            const topListEl = document.getElementById('topParticipantsList');
            topListEl.innerHTML = '';

            top10.forEach((p, index) => {
                const medals = ['👑', '🥈', '🥉', '✨', '✨', '✨', '✨', '✨', '✨', '✨'];
                const card = document.createElement('div');
                card.className = 'glass-panel border border-cardBorder rounded-2xl p-4 sm:p-5 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 hover:border-amber-500/50 transition';
                card.innerHTML = `
                    <div class="flex items-center space-x-4">
                        <span class="text-2xl">${medals[index]}</span>
                        <div>
                            <div class="flex items-center space-x-2">
                                <span class="font-black text-white text-lg">${p.name}</span>
                                <span class="text-xs text-slate-400 bg-slate-800 px-2 py-0.5 rounded-md">${p.city}</span>
                            </div>
                            <p class="text-sm text-slate-300 italic mt-0.5">«${p.comment}»</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-4 w-full sm:w-auto justify-between sm:justify-end">
                        <span class="font-black text-emerald-400 text-lg">$${p.amount}</span>
                        <a href="${p.socialLink}" target="_blank" class="px-4 py-2 rounded-xl bg-accent/15 border border-accent/30 text-accent text-xs font-extrabold hover:bg-accent hover:text-white transition">
                            ${p.socialType} ↗
                        </a>
                    </div>
                `;
                topListEl.appendChild(card);
            });

            // Общая лента (начиная с 11-го)
            const feed = sorted.slice(10);
            const feedListEl = document.getElementById('feedParticipantsList');
            feedListEl.innerHTML = '';

            if (feed.length === 0) {
                feedListEl.innerHTML = `<p class="text-slate-400 text-center py-4 text-sm">${currentLang === 'ru' ? 'В общей ленте пока пусто. Станьте следующим!' : 'General feed is empty. Be the next!'}</p>`;
            } else {
                feed.forEach(p => {
                    const row = document.createElement('div');
                    row.className = 'p-4 rounded-2xl bg-darkBg/60 border border-cardBorder flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 hover:border-accent/30 transition';
                    row.innerHTML = `
                        <div class="flex items-center space-x-3">
                            <span class="text-slate-500 text-sm font-bold">#${p.id}</span>
                            <div>
                                <div class="flex items-center space-x-2">
                                    <span class="font-bold text-white text-base">${p.name}</span>
                                    <span class="text-xs text-slate-400">(${p.city})</span>
                                </div>
                                <p class="text-xs text-slate-300 italic">«${p.comment}»</p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-3 w-full sm:w-auto justify-between sm:justify-end">
                            <span class="font-extrabold text-emerald-400 text-base">$${p.amount}</span>
                            <a href="${p.socialLink}" target="_blank" class="px-3 py-1.5 rounded-lg bg-cardBg border border-cardBorder text-slate-300 text-xs font-bold hover:border-accent hover:text-white transition">
                                ${p.socialType} ↗
                            </a>
                        </div>
                    `;
                    feedListEl.appendChild(row);
                });
            }
        }

        function handleParticipantSubmit(e) {
            e.preventDefault();
            const newParticipant = {
                id: participants.length + 1,
                name: document.getElementById('pName').value,
                age: parseInt(document.getElementById('pAge').value),
                email: document.getElementById('pEmail').value,
                city: document.getElementById('pCity').value,
                amount: currentDonationAmount,
                socialType: document.getElementById('pSocialType').value,
                socialLink: document.getElementById('pSocialLink').value,
                comment: document.getElementById('pComment').value || (currentLang === 'ru' ? 'Токио ждет!' : 'Tokyo awaits!')
            };

            participants.unshift(newParticipant);
            saveParticipantsToStorage();
            renderParticipants();
            closeModals();
            document.getElementById('participantForm').reset();
            
            alert(currentLang === 'ru' ? '🎉 Спасибо! Вы в деле. Сертификат совладельца мечты отправлен на вашу почту.' : '🎉 Thank you! You are in. The dream shareholder certificate has been sent to your email.');
        }
