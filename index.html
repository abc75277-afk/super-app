<!-- Подключаем официальный клиент Supabase из CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL = 'https://vjcthmoammkrirzjoybq.supabase.co';
        const SUPABASE_ANON_KEY = 'ВСТАВЬ_СВОЙ_ANON_KEY_ЗДЕСЬ'; // Твой ключ доступа

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentDonationAmount = 1;
        let lastCreatedParticipant = null;

        document.addEventListener('DOMContentLoaded', () => {
            fetchDonations();
        });

        // Уровень участия
        function getParticipantTier(amount) {
            const amt = Number(amount);
            if (amt >= 100) return { name: '🥇 Легенда маршрута ($100+)', badgeClass: 'text-amber-300 border-amber-400/30 bg-amber-500/10', physical: true };
            if (amt >= 25) return { name: '🥈 Совладелец ($25+)', badgeClass: 'text-slate-200 border-slate-400/30 bg-slate-500/10', physical: true };
            return { name: '🎟️ Участник ($1+)', badgeClass: 'text-amber-600 border-amber-700/30 bg-amber-900/10', physical: false };
        }

        // Загрузка данных
        async function fetchDonations() {
            try {
                // Загружаем все донаты, от старых к новым (для Зала Основателей)
                const { data, error } = await supabaseClient
                    .from('donations')
                    .select('*')
                    .order('created_at', { ascending: true });

                if (error) {
                    console.error('Ошибка загрузки:', error.message);
                    return;
                }

                updateUI(data || []);
            } catch (err) {
                console.error('Сетевая ошибка:', err);
            }
        }

        // Обновление интерфейса
        function updateUI(donationsAsc) {
            const totalSum = donationsAsc.reduce((acc, item) => acc + Number(item.amount), 0);
            document.getElementById('totalAmount').textContent = totalSum;

            const goal = 1000000;
            let percentage = (totalSum / goal) * 100;
            if (percentage < 0.008 && totalSum > 0) percentage = 0.008;
            if (percentage > 100) percentage = 100;

            document.getElementById('progressBar').style.width = percentage + '%';
            document.getElementById('progressText').textContent = `Прогресс: ${percentage.toFixed(3)}%`;
            
            const uniqueCountries = new Set(donationsAsc.map(i => i.city).filter(Boolean)).size || 1;
            
            if (document.getElementById('participantsBadge')) {
                document.getElementById('participantsBadge').textContent = `В проекте уже ${donationsAsc.length} совладельцев мечты из ${uniqueCountries} стран мира`;
            }

            // 1. ЗАЛ ОСНОВАТЕЛЕЙ (Первые 10 по времени создания, от старых к новым)
            const foundersEl = document.getElementById('foundersList');
            const top10Founders = donationsAsc.slice(0, 10);
            if (foundersEl) {
                foundersEl.innerHTML = top10Founders.map((item, index) => {
                    const tier = getParticipantTier(item.amount);
                    return `
                        <div class="glass-panel border border-amber-500/30 rounded-2xl p-4 flex items-center justify-between bg-amber-950/10">
                            <div class="flex items-center space-x-4">
                                <span class="text-amber-400 font-black text-lg">🏛️ #${index + 1}</span>
                                <div>
                                    <div class="flex items-center space-x-2">
                                        <span class="font-bold text-white">${escapeHtml(item.donor_name)}</span>
                                        <span class="text-xs px-2 py-0.5 rounded-full border ${tier.badgeClass}">${tier.name}</span>
                                    </div>
                                    <div class="text-xs text-slate-400 mt-0.5">
                                        ${item.city ? '📍 ' + escapeHtml(item.city) : ''} • Основатель с ${formatDate(item.created_at)}
                                    </div>
                                </div>
                            </div>
                            <div class="text-emerald-400 font-black text-lg">$${item.amount}</div>
                        </div>
                    `;
                }).join('') || '<div class="text-slate-500 text-sm">Зал основателей пока пуст</div>';
            }

            // 2. РЕЙТИНГ ПО ВКЛАДУ (Сортировка по сумме от большего к меньшему)
            const donationsDesc = [...donationsAsc].sort((a, b) => Number(b.amount) - Number(a.amount));
            const topContributorsEl = document.getElementById('topContributorsList');
            const top10Contributors = donationsDesc.slice(0, 10);
            
            if (topContributorsEl) {
                topContributorsEl.innerHTML = top10Contributors.map((item, index) => {
                    const tier = getParticipantTier(item.amount);
                    const sharePercent = ((item.amount / goal) * 100).toFixed(4);
                    
                    return `
                        <div class="glass-panel border border-cardBorder rounded-2xl p-4 flex items-center justify-between">
                            <div class="flex items-center space-x-4">
                                <span class="text-indigo-400 font-black text-lg">💎 #${index + 1}</span>
                                <div>
                                    <div class="flex items-center space-x-2">
                                        <span class="font-bold text-white">${escapeHtml(item.donor_name)}</span>
                                        <span class="text-xs px-2 py-0.5 rounded-full border ${tier.badgeClass}">${tier.name}</span>
                                    </div>
                                    <div class="text-xs text-slate-400 mt-0.5">
                                        ${item.city ? '📍 ' + escapeHtml(item.city) : ''} 
                                        <span class="text-slate-500 ml-1">• Доля: ${sharePercent}%</span>
                                    </div>
                                </div>
                            </div>
                            <div class="text-emerald-400 font-black text-lg">$${item.amount}</div>
                        </div>
                    `;
                }).join('') || '<div class="text-slate-500 text-sm">Пока нет вкладов</div>';
            }

            // 3. ХРОНИКА УЧАСТНИКОВ (Лента)
            const feedListEl = document.getElementById('feedParticipantsList');
            const donationsByDateDesc = [...donationsAsc].reverse();
            if (feedListEl) {
                feedListEl.innerHTML = donationsByDateDesc.map((item, idx) => {
                    const participantNum = donationsAsc.length - idx;
                    const tier = getParticipantTier(item.amount);
                    
                    return `
                        <div class="border-b border-slate-800/60 pb-3 mb-3 last:border-none last:mb-0 last:pb-0">
                            <div class="flex justify-between items-start">
                                <div>
                                    <div class="flex items-center space-x-2">
                                        <span class="font-bold text-white">Участник #${participantNum} — ${escapeHtml(item.donor_name)}</span>
                                        <span class="text-[10px] px-1.5 py-0.5 rounded border ${tier.badgeClass}">${tier.name}</span>
                                    </div>
                                    <span class="text-xs text-slate-400">${formatDate(item.created_at)} ${item.city ? '• ' + escapeHtml(item.city) : ''}</span>
                                </div>
                                <span class="text-emerald-400 font-extrabold">+$${item.amount}</span>
                            </div>
                            ${item.comment ? `<p class="text-sm text-slate-300 mt-1 italic">"${escapeHtml(item.comment)}"</p>` : ''}
                        </div>
                    `;
                }).join('') || '<div class="text-slate-500 text-sm">Хроника пуста</div>';
            }

            // 4. ЗАЛ ДОСТИЖЕНИЙ (Генерация бейджей по правилям)
            renderAchievements(donationsAsc, totalSum);
        }

        // Логика достижений
        function renderAchievements(donations, totalSum) {
            const achievementsEl = document.getElementById('achievementsList');
            if (!achievementsEl) return;

            let badges = [];

            // Первый участник
            if (donations.length > 0) {
                badges.push({
                    icon: '🏆',
                    title: 'Первый участник',
                    desc: `${donations[0].donor_name} заложил основу проекта`,
                    date: formatDate(donations[0].created_at)
                });
            }

            // Первый вклад $100+
            const first100 = donations.find(i => Number(i.amount) >= 100);
            if (first100) {
                badges.push({
                    icon: '💎',
                    title: 'Первый крупный вклад ($100+)',
                    desc: `${first100.donor_name} поверил в масштаб`,
                    date: formatDate(first100.created_at)
                });
            }

            // Первые участники по городам/странам (уникальные города)
            const seenCities = new Set();
            donations.forEach(item => {
                if (item.city && !seenCities.has(item.city.toLowerCase().trim())) {
                    seenCities.add(item.city.toLowerCase().trim());
                    if (seenCities.size <= 5) { // показываем первые несколько уникальных локаций
                        badges.push({
                            icon: '🌍',
                            title: `Первый из: ${item.city}`,
                            desc: `${item.donor_name} расширил географию проекта`,
                            date: formatDate(item.created_at)
                        });
                    }
                }
            });

            // Достижение по общей сумме
            if (totalSum >= 10000) {
                badges.push({
                    icon: '⭐',
                    title: 'Рубеж $10,000 достигнут',
                    desc: 'Проект преодолел важную финансовую отметку!',
                    date: 'Активно'
                });
            } else {
                badges.push({
                    icon: '⏳',
                    title: 'Путь к $10,000',
                    desc: `Осталось собрать до первого крупного рубежа: $${10000 - totalSum}`,
                    date: 'В процессе'
                });
            }

            achievementsEl.innerHTML = badges.map(b => `
                <div class="glass-panel border border-slate-800 rounded-2xl p-4 flex items-center space-x-4">
                    <div class="text-3xl">${b.icon}</div>
                    <div>
                        <div class="font-bold text-white text-sm">${b.title}</div>
                        <div class="text-xs text-slate-300 mt-0.5">${b.desc}</div>
                        <div class="text-[10px] text-amber-400 mt-1 font-mono">${b.date}</div>
                    </div>
                </div>
            `).join('');
        }

        // Модальное окно сертификата
        function showCertificate(p) {
            let certModal = document.getElementById('certificateModal');
            if (!certModal) {
                certModal = document.createElement('div');
                certModal.id = 'certificateModal';
                certModal.className = 'fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden items-center justify-center p-4';
                certModal.innerHTML = `
                    <div class="glass-panel border-2 border-amber-500/50 rounded-3xl p-6 md:p-8 max-w-lg w-full text-center relative shadow-2xl bg-slate-900/95">
                        <div class="absolute top-4 right-4 text-slate-400 hover:text-white cursor-pointer text-xl" onclick="document.getElementById('certificateModal').classList.add('hidden')">✕</div>
                        
                        <div class="text-amber-400 font-mono tracking-widest text-xs uppercase mb-1">CERTIFICATE OF DREAM OWNERSHIP</div>
                        <h3 class="text-xl md:text-2xl font-black text-white mb-3">Сертификат совладельца мечты</h3>
                        
                        <p class="text-xs text-slate-400 mb-2">Настоящим подтверждается, что</p>
                        <div class="text-xl font-bold text-amber-300 mb-3 pb-1 border-b border-slate-800" id="certName">Иван Петров</div>
                        <p class="text-xs text-slate-400 mb-5">стал официальным участником проекта<br><span class="text-white font-semibold">The Million Dollar Tokyo Ticket</span></p>
                        
                        <div class="bg-slate-950/70 border border-slate-800 rounded-2xl p-4 mb-5 text-left space-y-2 text-sm">
                            <div class="flex justify-between"><span class="text-slate-400">Запись участника:</span> <span class="text-white font-bold" id="certId">#847</span></div>
                            <div class="flex justify-between"><span class="text-slate-400">Вклад в мечту:</span> <span class="text-emerald-400 font-bold" id="certAmount">$1</span></div>
                            <div class="flex justify-between"><span class="text-slate-400">Уровень:</span> <span class="text-amber-400 font-bold" id="certTier">Участник</span></div>
                            <div class="flex justify-between"><span class="text-slate-400">Дата присоединения:</span> <span class="text-slate-300" id="certDate">06.10.2026</span></div>
                        </div>

                        <div id="physicalBonus" class="hidden mb-4 p-3 bg-amber-500/10 border border-amber-500/30 rounded-xl text-xs text-amber-300">
                            🎁 <strong>Вам положен физический сертификат в рамке</strong> с личной подписью автора проекта! Мы свяжемся с вами по email для уточнения адреса доставки.
                        </div>

                        <p class="text-xs italic text-slate-300 mb-5">"Каждая большая история начинается с одного маленького шага."</p>
                        
                        <div class="text-[11px] text-slate-400 mb-5 space-y-1">
                            <div>Цифровой архив проекта: <span class="text-indigo-400 font-mono">tokyo-ticket-app</span></div>
                            <div class="font-bold text-slate-300 mt-1">Подпись: Игорь Дьяконов</div>
                        </div>
                        
                        <button onclick="window.print()" class="w-full py-3 bg-gradient-to-r from-amber-500 to-yellow-500 text-slate-950 font-bold rounded-xl shadow-lg hover:opacity-90 transition">
                            Сохранить / Распечатать сертификат 📄
                        </button>
                    </div>
                `;
                document.body.appendChild(certModal);
            }

            const dateStr = formatDate(p.created_at || new Date());
            const recordId = p.id ? `#${p.id.slice(0, 6).toUpperCase()}` : '#847';
            const tier = getParticipantTier(p.amount);

            document.getElementById('certName').textContent = p.donor_name;
            document.getElementById('certAmount').textContent = `$${p.amount}`;
            document.getElementById('certDate').textContent = dateStr;
            document.getElementById('certId').textContent = recordId;
            document.getElementById('certTier').textContent = tier.name;

            const physicalBonusEl = document.getElementById('physicalBonus');
            if (tier.physical) {
                physicalBonusEl.classList.remove('hidden');
            } else {
                physicalBonusEl.classList.add('hidden');
            }

            certModal.classList.remove('hidden');
            certModal.classList.add('flex');
        }

        async function handleParticipantSubmit(event) {
            event.preventDefault();

            const name = document.getElementById('pName').value;
            const age = document.getElementById('pAge').value;
            const email = document.getElementById('pEmail').value;
            const city = document.getElementById('pCity').value;
            const socialType = document.getElementById('pSocialType').value;
            const socialLink = document.getElementById('pSocialLink').value;
            const comment = document.getElementById('pComment').value;

            const newRecord = {
                donor_name: name,
                amount: currentDonationAmount,
                age: parseInt(age) || null,
                email: email,
                city: city,
                social_type: socialType,
                social_link: socialLink,
                comment: comment
            };

            const { data, error } = await supabaseClient
                .from('donations')
                .insert([newRecord])
                .select();

            if (error) {
                alert('Ошибка при сохранении: ' + error.message);
                return;
            }

            lastCreatedParticipant = data ? data[0] : newRecord;

            closeModals();
            document.getElementById('participantForm').reset();
            fetchDonations();

            showCertificate(lastCreatedParticipant);
        }

        function openPaymentModal() {
            document.getElementById('paymentModal').classList.remove('hidden');
            document.getElementById('paymentModal').classList.add('flex');
        }

        function proceedToDataForm() {
            const amt = parseFloat(document.getElementById('customAmount').value);
            if (!amt || amt <= 0) {
                alert('Введите корректную сумму');
                return;
            }
            currentDonationAmount = amt;
            document.getElementById('paymentModal').classList.add('hidden');
            document.getElementById('paymentModal').classList.remove('flex');
            
            document.getElementById('dataModal').classList.remove('hidden');
            document.getElementById('dataModal').classList.add('flex');
        }

        function closeModals() {
            document.getElementById('paymentModal').classList.add('hidden');
            document.getElementById('paymentModal').classList.remove('flex');
            document.getElementById('dataModal').classList.add('hidden');
            document.getElementById('dataModal').classList.remove('flex');
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('ru-RU', { day: 'numeric', month: '2-digit', year: 'numeric' });
        }
    </script>
