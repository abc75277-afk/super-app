<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Достань Соседа: Telegram Edition</title>
    <!-- Подключаем Tailwind CSS для быстрого и красивого стилей -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-3px, 0px) rotate(-1deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            80% { transform: translate(1px, -1px) rotate(-1deg); }
            100% { transform: translate(1px, -2px) rotate(1deg); }
        }
        .shake-element {
            animation: shake 0.4s ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col justify-between select-none">

    <!-- Верхняя панель: Статистика -->
    <header class="w-full bg-slate-900 border-b border-slate-800 p-4 shadow-lg sticky top-0 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div>
                <p class="text-xs text-slate-400 uppercase tracking-wider">Очки троллинга</p>
                <h2 id="score" class="text-2xl font-black text-amber-400">0</h2>
            </div>
            <div class="text-right">
                <p class="text-xs text-slate-400 uppercase tracking-wider">Уровень пакостей</p>
                <h2 id="level" class="text-lg font-bold text-indigo-400">Новичок 🚷</h2>
            </div>
        </div>
    </header>

    <!-- Основной игровой экран -->
    <main class="max-w-md w-full mx-auto p-4 flex-1 flex flex-col justify-center items-center">
        
        <!-- Комната соседа и его состояние -->
        <div class="w-full bg-slate-900/80 border border-slate-800 rounded-2xl p-6 shadow-xl text-center relative overflow-hidden mb-6">
            <div class="absolute -right-6 -bottom-6 text-8xl opacity-10 pointer-events-none">🏠</div>
            
            <!-- Аватарка соседа -->
            <div id="neighbor-avatar" class="w-28 h-28 mx-auto bg-slate-800 rounded-full border-4 border-slate-700 flex items-center justify-center text-5xl mb-4 transition-all duration-200 shadow-inner">
                👴💢
            </div>
            
            <h3 id="neighbor-status" class="text-lg font-bold text-slate-200 mb-1">Сосед мирно читает газету...</h3>
            <p id="action-log" class="text-xs text-amber-300/80 h-6 mb-4 italic">Сделай первую пакость!</p>

            <!-- Шкала ярости -->
            <div class="w-full bg-slate-800 rounded-full h-4 p-0.5 border border-slate-700">
                <div id="rage-bar" class="bg-gradient-to-r from-amber-500 to-rose-600 h-full rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
            <div class="flex justify-between text-xs text-slate-400 mt-1">
                <span>Спокоен</span>
                <span id="rage-text">Ярость: 0%</span>
                <span>Взрыв 🔥</span>
            </div>
        </div>

        <!-- Кнопка главного действия (Быстрая пакость) -->
        <div class="w-full mb-6">
            <button id="taunt-btn" class="w-full py-4 bg-gradient-to-r from-rose-600 to-orange-600 hover:from-rose-500 hover:to-orange-500 active:scale-95 text-white font-black text-lg rounded-2xl shadow-lg shadow-rose-900/30 transition-all border border-rose-500/40">
                💥 НАБАЗОРИТЬ (Тап!)
            </button>
        </div>

        <!-- Магазин пакостей -->
        <div class="w-full bg-slate-900/50 border border-slate-800/80 rounded-2xl p-4">
            <h4 class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-3">Арсенал гадостей</h4>
            <div id="upgrades-list" class="space-y-2">
                <!-- Динамически заполняется через JS -->
            </div>
        </div>

    </main>

    <!-- Нижняя панель / Меню -->
    <footer class="w-full bg-slate-900 border-t border-slate-800 p-3 text-center text-xs text-slate-500">
        Telegram Mini Apps • Создано для хайпового запуска 🚀
    </footer>

    <!-- Игровая логика на JavaScript -->
    <script>
        // Игровое состояние
        let game = {
            score: 0,
            clickPower: 1,
            rage: 0,
            maxRage: 100,
            level: 1,
            autoClickerPower: 0
        };

        // База пакостей и улучшений
        const upgrades = [
            { id: 1, name: "📌 Кнопка на стул", cost: 15, power: 1, desc: "+1 к силе пакости", count: 0 },
            { id: 2, name: "🌶️ Перец в чай", cost: 100, power: 5, desc: "+5 к силе пакости", count: 0 },
            { id: 3, name: "🔊 Колонка под дверь", cost: 500, power: 20, desc: "+20 к силе пакости", count: 0 },
            { id: 4, name: "🐈 Запустить кота", cost: 2000, power: 100, desc: "Авто-троллинг (+10 оч./сек)", auto: 10, count: 0 }
        ];

        // Фразы и реакции соседа
        const neighborReactions = [
            "Что за черт?!", кто тут шумит?!", 
            "Я вызову полицию!", "Мои нервы на пределе!", 
            "Ах ты негодяй!", "Ууу, погоди у меня!"
        ];

        // DOM элементы
        const scoreEl = document.getElementById('score');
        const levelEl = document.getElementById('level');
        const tauntBtn = document.getElementById('taunt-btn');
        const rageBar = document.getElementById('rage-bar');
        const rageText = document.getElementById('rage-text');
        const neighborAvatar = document.getElementById('neighbor-avatar');
        const neighborStatus = document.getElementById('neighbor-status');
        const actionLog = document.getElementById('action-log');
        const upgradesList = document.getElementById('upgrades-list');

        // Рендер магазина улучшений
        function renderUpgrades() {
            upgradesList.innerHTML = '';
            upgrades.forEach(up => {
                const disabled = game.score < up.cost ? 'opacity-50 cursor-not-allowed' : 'hover:border-rose-500/50 cursor-pointer';
                const html = `
                    <div onclick="buyUpgrade(${up.id})" class="flex justify-between items-center bg-slate-800/60 border border-slate-700/60 p-3 rounded-xl transition-all ${disabled}">
                        <div class="text-left">
                            <h5 class="font-bold text-sm text-slate-200">${up.name} <span class="text-xs text-amber-400">(${up.count})</span></h5>
                            <p class="text-xs text-slate-400">${up.desc}</p>
                        </div>
                        <div class="bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-700 text-amber-400 font-bold text-sm">
                            🪙 ${up.cost}
                        </div>
                    </div>
                `;
                upgradesList.innerHTML += html;
            });
        }

        // Клик по главной кнопке пакости
        tauntBtn.addEventListener('click', () => {
            game.score += game.clickPower;
            game.rage += game.clickPower * 2;

            if (game.rage >= game.maxRage) {
                game.rage = 0;
                game.score += 50 * game.level; // бонус за взрыв ярости
                triggerRageExplosion();
            }

            updateUI();
            playAnimation();
        });

        // Эффект взрыва ярости
        function triggerRageExplosion() {
            const randomPhrase = neighborReactions[Math.floor(Math.random() * neighborReactions.length)];
            neighborStatus.textContent = `🤬 ${randomPhrase}`;
            actionLog.textContent = "Сосед сорвался с места! +Бонус очков!";
            neighborAvatar.classList.add('shake-element');
            setTimeout(() => neighborAvatar.classList.remove('shake-element'), 500);
        }

        // Покупка улучшений
        function buyUpgrade(id) {
            const up = upgrades.find(u => u.id === id);
            if (game.score >= up.cost) {
                game.score -= up.cost;
                up.count++;
                
                if (up.auto) {
                    game.autoClickerPower += up.auto;
                } else {
                    game.clickPower += up.power;
                }

                // Увеличиваем стоимость следующей покупки
                up.cost = Math.floor(up.cost * 1.4);
                renderUpgrades();
                updateUI();
            }
        }

        // Анимация клика на аватар
        function playAnimation() {
            neighborAvatar.classList.add('scale-105');
            setTimeout(() => neighborAvatar.classList.remove('scale-105'), 100);
            
            const randomActions = [
                "Ты подкрутил ему стул 🪑",
                "Насыпал канцелярских кнопок 📌",
                "Напугал кота под дверью 🐈",
                "Испортил телевизионную антенну 📺"
            ];
            actionLog.textContent = randomActions[Math.floor(Math.random() * randomActions.length)];
        }

        // Обновление интерфейса
        function updateUI() {
            scoreEl.textContent = game.score;
            rageBar.style.width = `${(game.rage / game.maxRage) * 100}%`;
            rageText.textContent = `Ярость: ${Math.floor((game.rage / game.maxRage) * 100)}%`;
            renderUpgrades();
        }

        // Автоматический доход (пассивный троллинг)
        setInterval(() => {
            if (game.autoClickerPower > 0) {
                game.score += game.autoClickerPower;
                game.rage = Math.min(game.maxRage, game.rage + game.autoClickerPower / 2);
                updateUI();
            }
        }, 1000);

        // Первый запуск рендеринга
        renderUpgrades();
    </script>
</body>
</html>
